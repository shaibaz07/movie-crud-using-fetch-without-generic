        <div class="movieModal" id="movieModal">
            <form id="movieForm">
                <div class="card">
                    <div class="card-header d-flex justify-content-between">
                        <h3 class="m-0" id="changeTxt">Add Movie</h3>
                        <i role="button" class="closeMovieModal fa-solid fa-xmark fa-2x text-danger"></i>
                    </div>
                    <div class="card-body">
                        <div class="form-group">
                            <label for="movieName">Movie Name</label>
                            <input type="text" class="form-control" id="movieName">
                        </div>

                        <div class="form-group">
                            <label for="movieImg">Movie Image</label>
                            <input type="text" id="movieImg" class="form-control">
                        </div>
                        <div class="form-group">

                            <label for="movieDescription">Movie Discription</label>
                            <textarea id="movieDescription" class="form-control"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-4 form-group">
                                <label for="movieRating">Movie Rating</label>
                                <select id="movieRating" class="form-control">
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>

                                </select>
                            </div>
                            <div class="col-4 form-group">
                                <label for="movieGener">Movie Gener</label>
                                <select id="movieGener" class="form-control">
                                    <option value="">Select Genre</option>
                                    <option value="Action">Action</option>
                                    <option value="Comedy">Comedy</option>
                                    <option value="Drama">Drama</option>
                                    <option value="Horror">Horror</option>
                                    <option value="Romance">Romance</option>
                                    <option value="Crime/Action">Crime/Action</option>
                                    <option value="sci/fic">sci/fic</option>

                                </select>
                            </div>
                            <div class="col-4 form-group">
                                <label for="movieReleaseDate">Movie Release Date</label>
                                <input type="date" id="movieReleaseDate" class="form-control">
                            </div>
                        </div>

                    </div>
                    <div class="card-footer d-flex justify-content-between">
                        <button class="btn net-sec-btn btn-sm" id="addMovieBtn">Add Movie</button>
                        <button type="button" class="btn net-sec-btn btn-sm d-none" id="updateMovieBtn">Update Movie</button>
                        <button type="button" class=" closeMovieModal btn net-pri-btn btn-sm">Close</button>

                    </div>
                </div>
            </form>
        </div>
            <div class="backDrop closeMovieModal" id="backDrop"></div>
